<!DOCTYPE html>
<html lang="id">
<head>

<title>AFFILIATE PRO TOOLS</title>

<style>
/* =========================
   BASE
========================= */
html, body {
  background:#f4f4f4;
  font-family: Arial;
  margin:0;
  padding:20px;
  color:#111;
}

* {
  box-sizing:border-box;
}

/* =========================
   SECTION
========================= */
.section {
  background:#fff;
  padding:16px;
  margin-bottom:16px;
  border-radius:12px;
  border:1px solid #ddd;
}

/* =========================
   LABEL (FIX: PUTIH)
========================= */
label {
  font-weight:bold;
  display:block;
  margin-top:10px;
  color:#fff;
}

/* =========================
   INPUT
========================= */
input, select, textarea {
  width:100%;
  padding:10px;
  margin-top:5px;
  margin-bottom:10px;
  border-radius:10px;

  background:#1a1a1a;
  color:#fff;
  border:1px solid #333;
}

option {
  background:#1a1a1a;
  color:#fff;
}

/* =========================
   BUTTON
========================= */
button {
  width:100%;
  padding:12px;
  background:#111;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

button:hover {
  background:#333;
}

/* =========================
   CARD OUTPUT (DARK)
========================= */
.card {
  background:#111;
  color:#fff;
  border:1px solid #222;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
}

/* =========================
   SAAS BAR
========================= */
.saas-bar {
  position:sticky;
  top:0;
  background:#111;
  color:#fff;
  padding:10px;
  border-radius:10px;
  margin-bottom:15px;
  font-size:12px;
}

.badge {
  background:#111;
  color:#fff;
  padding:2px 6px;
  border-radius:4px;
  font-size:10px;
}

/* =========================
   OTHER INPUT HIDE
========================= */
.other-box {
  display:none;
}

/* =========================
   OUTPUT TEXT FIX
========================= */
pre {
  white-space:pre-wrap;
  word-wrap:break-word;
  color:#fff;
  background:transparent;
}

/* =========================
   BACKGROUND EFFECT
========================= */
body::before {
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  background:
    radial-gradient(circle at 20% 20%, rgba(168,85,247,0.2), transparent 40%),
    radial-gradient(circle at 80% 30%, rgba(250,204,21,0.1), transparent 45%);
  filter:blur(50px);
  opacity:0.8;
}
</style>

</head>

<script>
function toggleOther(select, id){
  const el = document.getElementById(id);
  if(!el) return;

  if(select.value === "Lainnya"){
    el.style.display = "block";
  } else {
    el.style.display = "none";
    el.value = "";
  }
}
 </script>
